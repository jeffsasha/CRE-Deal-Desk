{% load i18n %}<form class="card toolbar" method="get" style="margin-bottom:14px;border-radius:var(--radius)">
  <select name="year" data-autosubmit><option value="">{% translate "Year" %}</option>{% for y in years %}<option value="{{ y }}" {% if params.year == y|stringformat:"s" or not params.year and not params.start and f.start.year == y and f.label|length == 4 %}selected{% endif %}>{{ y }}</option>{% endfor %}</select>
  <select name="quarter" data-autosubmit><option value="">{% translate "Quarter" %}</option>{% for q in "1234"|make_list %}<option value="{{ q }}" {% if params.quarter == q %}selected{% endif %}>{% blocktranslate with number=q %}Quarter {{ number }}{% endblocktranslate %}</option>{% endfor %}</select>
  <select name="month" data-autosubmit><option value="">{% translate "Month" %}</option>{% for m in "123456789"|make_list %}<option value="{{ m }}" {% if params.month == m %}selected{% endif %}>{{ m }}</option>{% endfor %}<option value="10" {% if params.month == '10' %}selected{% endif %}>10</option><option value="11" {% if params.month == '11' %}selected{% endif %}>11</option><option value="12" {% if params.month == '12' %}selected{% endif %}>12</option></select>
  <select name="client" data-autosubmit><option value="">{% translate "Client: all" %}</option>{% for c in clients %}<option value="{{ c.pk }}" {% if params.client == c.pk|stringformat:"s" %}selected{% endif %}>{{ c }}</option>{% endfor %}</select>
  <select name="property_type" data-autosubmit><option value="">{% translate "Property type: all" %}</option>{% for k, v in property_types %}<option value="{{ k }}" {% if params.property_type == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
  <select name="transaction_type" data-autosubmit><option value="">{% translate "Transaction: all" %}</option>{% for k, v in transaction_types %}<option value="{{ k }}" {% if params.transaction_type == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
  <select name="side" data-autosubmit><option value="">{% translate "Represented side: all" %}</option>{% for k, v in sides %}<option value="{{ k }}" {% if params.side == k %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
  <select name="broker" data-autosubmit><option value="">{% translate "Broker: all" %}</option>{% for u in brokers %}<option value="{{ u.pk }}" {% if params.broker == u.pk|stringformat:"s" %}selected{% endif %}>{{ u }}</option>{% endfor %}</select>
  <select name="title_company" data-autosubmit><option value="">{% translate "Title company: all" %}</option>{% for o in title_companies %}<option value="{{ o.pk }}" {% if params.title_company == o.pk|stringformat:"s" %}selected{% endif %}>{{ o }}</option>{% endfor %}</select>
  <a class="btn btn-sm btn-ghost" href="?">{% translate "Reset" %}</a>
  <div class="grow"></div><strong>{{ f.label|tr }}</strong>
</form>
