{% load i18n %}<!doctype html>
{% get_current_language as LANG %}<html lang="{{ LANG }}">
<head><title>{% block title %}DealDesk{% endblock %} · {% translate "SKW DealDesk" %}</title></head>
<body>
<main class="content" data-workspace-page="{{ workspace_page }}" tabindex="-1">
  {% if messages %}<div class="messages">{% for m in messages %}<div class="notice notice-{{ m.tags }}">{{ m }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body></html>
