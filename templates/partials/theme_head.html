{% load static %}<script>
  /* Apply the saved theme before first paint so there is no flash. */
  (function () {
    try {
      var t = localStorage.getItem("dd-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
    /* Neon Reveal: ignite on the first main page after the opening page (or the
       first main page of a visit); later pages show the tube already lit. */
    try {
      if (location.pathname === "/") sessionStorage.removeItem("dd-neon-lit");
      if (location.pathname !== "/" && !sessionStorage.getItem("dd-neon-lit")
          && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("neon-igniting");
        sessionStorage.setItem("dd-neon-lit", "1");
      }
    } catch (e) {}
  })();
</script>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
