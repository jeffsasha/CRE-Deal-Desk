{% load i18n %}{% get_current_language as LANG %}<form class="lang-switch segmented" action="{% url 'set_language' %}" method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button name="language" value="en" class="{% if not LANG|slice:':2' == 'zh' %}on{% endif %}" title="{% translate "English" %}">EN</button><button name="language" value="zh-hans" class="{% if LANG|slice:':2' == 'zh' %}on{% endif %}" title="简体中文">中</button></form>
