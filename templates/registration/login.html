{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · SKW DealDesk</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head>
<body>
{% if DEMO_MODE %}<div class="demo-banner">DEMO MODE — fictional sample data in an isolated database.</div>{% endif %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body">
      <div class="brand" style="padding:0 0 16px"><div class="brand-mark">DD</div><div><div class="brand-name">SKW DealDesk</div><div class="brand-sub">{{ FIRM_NAME }} · Private workspace</div></div></div>
      {% if form.errors %}<div class="notice notice-error">The username or password is incorrect.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="field" style="margin-bottom:12px"><label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" autofocus required></div>
        <div class="field" style="margin-bottom:16px"><label for="id_password">Password</label><input id="id_password" type="password" name="password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
      </form>
    </div>
  </div>
</div></body></html>
