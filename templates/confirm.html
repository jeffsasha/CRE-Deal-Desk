{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="crumbs">{% if back_url %}<a href="{{ back_url }}">← Back</a>{% endif %}</div>
<div class="page-head"><h1>{{ title }}</h1></div>
<div class="card" style="max-width:720px"><div class="card-body">
  <p>{{ message }}</p>
  <form method="post">{% csrf_token %}
    {% if reason_required %}<div class="field" style="margin:12px 0"><label>Reason *</label><textarea name="reason" required></textarea></div>{% endif %}
    <div class="form-actions"><button class="btn {% if danger %}btn-danger{% else %}btn-primary{% endif %}">{{ submit_label|default:"Confirm" }}</button>{% if back_url %}<a class="btn" href="{{ back_url }}">Cancel</a>{% endif %}</div>
  </form>
</div></div>
{% endblock %}
