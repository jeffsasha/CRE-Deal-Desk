# Review paid resource pricing in Render before creating this Blueprint.
services:
  - type: web
    name: skw-dealdesk
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    branch: main
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /accounts/login/
    disk:
      name: dealdesk-private-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEALDESK_DATA_DIR
        value: /var/data
      - key: DEALDESK_OCR_ENGINE
        value: tesseract
      - key: DATABASE_URL
        fromDatabase:
          name: skw-dealdesk-db
          property: connectionString

databases:
  - name: skw-dealdesk-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "17"
    databaseName: dealdesk
    user: dealdesk
    diskSizeGB: 1
    ipAllowList: []
